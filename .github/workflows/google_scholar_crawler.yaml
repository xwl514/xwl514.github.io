name: Get Citation Data

on:
  page_build:
  schedule:
    - cron: '0 12 * * *' # 每天中午12点运行
  workflow_dispatch: # 允许手动触发

jobs:
  build:
    runs-on: ubuntu-22.04 # 修改为指定的稳定版本
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10' # 或者指定一个明确的版本，例如 '3.9', '3.10' (Ubuntu 22.04 默认 Python 3.10)
          cache: 'pip'

      - name: Install system dependencies (if still needed)
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-setuptools
        # 注意: actions/setup-python 和 pip 可能已经处理了setuptools的需求。
        # 你可以尝试移除此步骤，看看是否依然能成功安装 requirements.txt 中的包。

      - name: Install Python dependencies
        run: |
          ls -a
          cd ./google_scholar_crawler
          pip3 install -r requirements.txt

      - name: Run script
        run: |
          ls -a
          cd google_scholar_crawler
          python3 main.py
          cd ./results
          git init
          git config --local user.email "xwl514@outlook.com"
          git config --local user.name "xwl514" # 或者使用 ${{ github.actor }}
          git remote add origin "https://_:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git add *.json
          if git diff-index --quiet HEAD --; then
            echo "No changes to commit."
          else
            git commit -m "Updated Citation Data"
            git push origin HEAD:google-scholar-stats --force
          fi
        env:
          GOOGLE_SCHOLAR_ID: ${{ secrets.GOOGLE_SCHOLAR_ID }}

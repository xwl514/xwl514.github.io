name: Get Citation Data

on:
  push:
    branches: [master, main]
    paths:
      - 'google_scholar_crawler/**'
      - '_config.yml'
      - '.github/workflows/google-scholar-stats.yml'
  schedule:
    - cron: '0 12 * * *' # Daily at 20:00 Asia/Shanghai.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: google-scholar-stats
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: google_scholar_crawler/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r google_scholar_crawler/requirements.txt
      - name: Test crawler
        run: |
          python -m unittest discover -s google_scholar_crawler -p 'test_*.py'
          node google_scholar_crawler/test_frontend.cjs
      - name: Fetch citation data
        run: python google_scholar_crawler/main.py
        env:
          GOOGLE_SCHOLAR_ID: ${{ secrets.GOOGLE_SCHOLAR_ID }}
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          HTTPS_PROXY: ${{ secrets.GOOGLE_SCHOLAR_PROXY }}
      - name: Publish complete results
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin google-scholar-stats; then
            git fetch origin google-scholar-stats
            git worktree add --detach "$RUNNER_TEMP/scholar-stats" FETCH_HEAD
          else
            status=$?
            if [ "$status" -ne 2 ]; then exit "$status"; fi
            git worktree add --detach "$RUNNER_TEMP/scholar-stats" HEAD
            git -C "$RUNNER_TEMP/scholar-stats" checkout --orphan google-scholar-stats
            git -C "$RUNNER_TEMP/scholar-stats" rm -rf .
          fi
          cp google_scholar_crawler/results/gs_data*.json "$RUNNER_TEMP/scholar-stats/"
          cd "$RUNNER_TEMP/scholar-stats"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gs_data.json gs_data_shieldsio.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update Google Scholar citation data'
          git push origin HEAD:google-scholar-stats
